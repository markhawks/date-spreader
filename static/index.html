<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date Spreader</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='5' fill='white' stroke='%232563eb' stroke-width='2.6'/%3E%3Cpath d='M3 12h26M10 3v5M22 3v5' stroke='%232563eb' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='20.5' r='3.6' fill='%232563eb'/%3E%3C/svg%3E">
  <script>
    // Tema prima del disegno della pagina (niente lampo chiaro col tema scuro).
    // La preferenza vera è sul server; qui se ne usa la copia locale dell'ultima visita.
    (function () {
      var t = "system";
      try { t = localStorage.getItem("datespreader.theme") || "system"; } catch (e) {}
      if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <svg class="brand-logo" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
        <rect x="3" y="5" width="26" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
        <path d="M3 12h26M10 3v5M22 3v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="16" cy="20.5" r="3.2" fill="currentColor"/></svg>
      <h1 class="brand">Date Spreader</h1>
      <button type="button" id="version-link" class="version-link" title="Novità del portale (changelog)"></button>
    </div>
    <div class="topbar-actions" id="topbar-actions">
      <button type="button" id="btn-servers" class="btn" title="Anagrafica server: ricerca e storico degli interventi">Server</button>
      <button type="button" id="btn-people" class="btn" title="Gestione utenti e accessi">Utenti</button>
      <button type="button" id="btn-settings" class="btn icon-only" title="Impostazioni" aria-label="Impostazioni">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M8.6 2.5h2.8l.4 2.1 1.5.8 2-.8 1.4 2.4-1.6 1.4v1.7l1.6 1.4-1.4 2.4-2-.8-1.5.8-.4 2.1H8.6l-.4-2.1-1.5-.8-2 .8-1.4-2.4 1.6-1.4V8.4L3.3 7l1.4-2.4 2 .8 1.5-.8z"/><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button type="button" id="btn-filters" class="btn" aria-expanded="false" aria-controls="filter-bar">Filtri</button>
      <button type="button" id="btn-today" class="btn">Oggi</button>
    </div>
  </header>

  <div id="filter-bar" class="filter-bar" aria-label="Filtri del calendario" hidden></div>

  <div id="banner" class="banner" role="alert" hidden></div>

  <div class="layout">
    <div class="sidebar-resizer" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Larghezza della colonna progetti (frecce sinistra/destra, doppio clic: predefinita)"
         title="Trascina per allargare o restringere · doppio clic: larghezza predefinita"></div>
    <aside class="sidebar" aria-label="Progetti">
      <div class="sidebar-head">
        <div class="sidebar-title">
          <h2>Progetti <span id="project-count" class="count"></span></h2>
          <div class="sidebar-tools">
            <select id="project-sort" class="mini-select" aria-label="Ordina o raggruppa i progetti" title="Ordina o raggruppa i progetti">
              <option value="name|none">A → Z</option>
              <option value="date|none">Per data</option>
              <option value="name|customer">Cliente · A → Z</option>
              <option value="date|customer">Cliente · per data</option>
            </select>
            <div class="view-toggle" role="group" aria-label="Vista dei progetti">
              <button type="button" class="view-btn" data-view="grid" aria-label="Quadrati" title="Quadrati">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>
              </button>
              <button type="button" class="view-btn" data-view="list" aria-label="Rettangoli (uno per riga)" title="Rettangoli, uno per riga">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12v3H2zM2 6.5h12v3H2zM2 10.5h12v3H2z"/></svg>
              </button>
            </div>
          </div>
        </div>
        <input id="project-search" type="search" placeholder="Cerca progetto, hostname, IP…"
               autocomplete="off" aria-label="Cerca progetto o server">
      </div>
      <ul id="project-list" class="project-grid" aria-live="polite"></ul>
      <p id="project-empty" class="muted empty" hidden>Nessun progetto trovato.</p>
      <section id="server-hits" class="server-hits" aria-live="polite" hidden></section>
    </aside>

    <main id="calendar-scroll" class="calendar-scroll" aria-label="Calendario" tabindex="-1">
      <div id="months" class="months"></div>
    </main>

    <aside id="detail" class="detail" aria-labelledby="detail-title" hidden>
      <div class="detail-resizer" role="separator" aria-orientation="horizontal" tabindex="0"
           aria-label="Altezza dell'anteprima (frecce su/giù)" title="Trascina per regolare l'altezza"></div>
      <header class="detail-header">
        <div>
          <h2 id="detail-title" class="detail-title"></h2>
          <p class="detail-sub muted"></p>
        </div>
        <div class="detail-actions">
          <button type="button" class="icon-btn" id="btn-detail-position" aria-label="Sposta l'anteprima" title="Sposta l'anteprima">
            <!-- icona "pannello in basso" (mostrata quando l'anteprima è a destra) -->
            <svg class="ico-to-bottom" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.5" y="2" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2.2" y="9" width="11.6" height="4.3" fill="currentColor" opacity=".55"/></svg>
            <!-- icona "pannello a destra" (mostrata quando l'anteprima è in basso) -->
            <svg class="ico-to-right" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.5" y="2" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2.7" width="4.8" height="10.6" fill="currentColor" opacity=".55"/></svg>
          </button>
          <button type="button" class="icon-btn" data-close aria-label="Chiudi dettaglio" title="Chiudi (Esc)"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
      </header>
      <div class="detail-body"></div>
    </aside>
  </div>

  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>

  <section id="inventory" class="sheet inventory" role="dialog" aria-modal="true" aria-labelledby="inventory-title" hidden></section>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
