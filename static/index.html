<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Date Spreader</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='24' rx='5' fill='white' stroke='%232563eb' stroke-width='2.6'/%3E%3Cpath d='M3 12h26M10 3v5M22 3v5' stroke='%232563eb' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='20.5' r='3.6' fill='%232563eb'/%3E%3C/svg%3E">
  <script>
    // Tema prima del disegno della pagina (niente lampo chiaro col tema scuro).
    // La preferenza vera è sul server; qui se ne usa la copia locale dell'ultima visita.
    (function () {
      var t = "system";
      try { t = localStorage.getItem("datespreader.theme") || "system"; } catch (e) {}
      if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <svg class="brand-logo" viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
        <rect x="3" y="5" width="26" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
        <path d="M3 12h26M10 3v5M22 3v5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="16" cy="20.5" r="3.2" fill="currentColor"/></svg>
      <h1 class="brand">Date Spreader</h1>
      <button type="button" id="version-link" class="version-link" title="What's new in the portal (changelog)" data-i18n-title="index.version_title"></button>
      <time id="topbar-clock" class="topbar-clock" hidden><span class="clock-date"></span><span class="clock-time"></span></time>
    </div>
    <div class="topbar-center">
      <button type="button" id="btn-today" class="btn btn-today" title="Back to today" data-i18n-title="index.today_title">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="11.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.8 6.2h12.4M5 1.5v2.6M11 1.5v2.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="10.2" r="1.7" fill="currentColor"/></svg>
        <span data-i18n="index.today">Today</span>
      </button>
      <div class="view-switch" role="group" aria-label="Calendar view" data-i18n-aria-label="index.view_switch">
        <button type="button" class="btn btn-today view-switch-btn" data-view="month" aria-pressed="true" title="Month view" data-i18n-title="index.month_title">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.8" y="2.3" width="12.4" height="11.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.8 6h12.4M1.8 9.8h12.4M6 6v7.7M10 6v7.7" stroke="currentColor" stroke-width="1.2"/></svg>
          <span data-i18n="index.month">Month</span>
        </button>
        <button type="button" class="btn btn-today view-switch-btn" data-view="week" aria-pressed="false" title="Week view: every intervention in detail" data-i18n-title="index.week_title">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.8" y="2.3" width="12.4" height="11.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5.9 2.3v11.4M10.1 2.3v11.4" stroke="currentColor" stroke-width="1.2"/></svg>
          <span data-i18n="index.week">Week</span>
        </button>
        <button type="button" class="btn btn-today view-switch-btn" data-view="team" aria-pressed="false" title="Technicians' workload: who is busy when, with conflicts highlighted" data-i18n-title="index.team_title">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="5.5" cy="5.2" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="11.2" cy="5.8" r="1.9" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.6 13.5c.4-2.4 2-3.7 3.9-3.7s3.5 1.3 3.9 3.7M9.6 9.9c.5-.3 1-.4 1.6-.4 1.6 0 2.9 1.1 3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <span data-i18n="index.team">Technicians</span>
        </button>
      </div>
      <button type="button" id="btn-workweek" class="btn btn-today days-toggle" aria-pressed="false"
              title="Monday to Friday: Saturday and Sunday appear only where there are interventions" data-i18n-title="index.days_workweek_title">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.8" y="2.3" width="12.4" height="11.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.4 6.2v5M6.7 6.2v5M9 6.2v5M11.3 6.2v5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <span data-i18n="index.days_workweek">Mon–Fri</span>
      </button>
    </div>
    <div class="topbar-actions" id="topbar-actions">
      <button type="button" id="btn-recap" class="btn" hidden title="Recap for smartphones" data-i18n-title="index.recap_title" data-i18n="index.recap">Recap</button>
      <button type="button" id="btn-gantt" class="btn" title="Gantt of a customer: commesse, technicians, hours, machines and statuses" data-i18n-title="index.gantt_title" data-i18n="index.gantt">Gantt</button>
      <button type="button" id="btn-servers" class="btn" title="Server inventory: search and intervention history" data-i18n-title="index.servers_title" data-i18n="index.servers">Servers</button>
      <button type="button" id="btn-people" class="btn" title="Manage users and access" data-i18n-title="index.people_title" data-i18n="index.people">Users</button>
      <button type="button" id="btn-settings" class="btn icon-only" title="Settings" aria-label="Settings" data-i18n-title="index.settings" data-i18n-aria-label="index.settings">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M8.6 2.5h2.8l.4 2.1 1.5.8 2-.8 1.4 2.4-1.6 1.4v1.7l1.6 1.4-1.4 2.4-2-.8-1.5.8-.4 2.1H8.6l-.4-2.1-1.5-.8-2 .8-1.4-2.4 1.6-1.4V8.4L3.3 7l1.4-2.4 2 .8 1.5-.8z"/><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button type="button" id="btn-filters" class="btn" aria-expanded="false" aria-controls="filter-bar" data-i18n="index.filters">Filters</button>
    </div>
  </header>

  <div id="filter-bar" class="filter-bar" aria-label="Calendar filters" data-i18n-aria-label="index.filter_bar" hidden></div>

  <div id="banner" class="banner" role="alert" hidden></div>

  <div class="layout">
    <div class="sidebar-resizer" role="separator" aria-orientation="vertical" tabindex="0"
         aria-label="Width of the projects column (left/right arrows, double-click: default)"
         data-i18n-aria-label="index.sidebar_resizer_aria"
         title="Drag to widen or narrow · double-click: default width"
         data-i18n-title="index.sidebar_resizer_title"></div>
    <aside class="sidebar" aria-label="Projects" data-i18n-aria-label="index.projects">
      <div class="sidebar-head">
        <div class="sidebar-title">
          <h2><span data-i18n="index.projects">Projects</span> <span id="project-count" class="count"></span></h2>
          <div class="sidebar-tools">
            <select id="project-sort" class="mini-select" aria-label="Sort or group the projects" title="Sort or group the projects" data-i18n-aria-label="index.project_sort" data-i18n-title="index.project_sort">
              <option value="name|none" data-i18n="index.sort_name">A → Z</option>
              <option value="date|none" data-i18n="index.sort_date">By date</option>
              <option value="name|customer" data-i18n="index.sort_customer_name">Customer · A → Z</option>
              <option value="date|customer" data-i18n="index.sort_customer_date">Customer · by date</option>
            </select>
            <button type="button" id="project-expand" class="expand-all-btn" aria-pressed="false" aria-label="Expand all projects" title="Expand all projects" data-i18n-aria-label="index.expand_all" data-i18n-title="index.expand_all">
              <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 3.5h11M5 8h8.5M5 12.5h8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M2.5 7v6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <div class="view-toggle" role="group" aria-label="Projects view" data-i18n-aria-label="index.project_view">
              <button type="button" class="view-btn" data-view="grid" aria-label="Squares" title="Squares" data-i18n-aria-label="index.view_grid" data-i18n-title="index.view_grid">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M2 2h5v5H2zM9 2h5v5H9zM2 9h5v5H2zM9 9h5v5H9z"/></svg>
              </button>
              <button type="button" class="view-btn" data-view="list" aria-label="Rectangles (one per row)" title="Rectangles, one per row" data-i18n-aria-label="index.view_list_aria" data-i18n-title="index.view_list_title">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M2 2.5h12v3H2zM2 6.5h12v3H2zM2 10.5h12v3H2z"/></svg>
              </button>
            </div>
          </div>
        </div>
        <input id="project-search" type="search" placeholder="Search project, hostname, IP…" data-i18n-placeholder="index.search_placeholder"
               autocomplete="off" aria-label="Search project or server" data-i18n-aria-label="index.search_aria">
        <div id="customer-menu" class="customer-menu"></div>
      </div>
      <ul id="project-list" class="project-grid" aria-live="polite"></ul>
      <p id="project-empty" class="muted empty" data-i18n="index.no_projects" hidden>No projects found.</p>
      <section id="server-hits" class="server-hits" aria-live="polite" hidden></section>
    </aside>

    <main id="calendar-scroll" class="calendar-scroll" aria-label="Calendar" data-i18n-aria-label="index.calendar" tabindex="-1">
      <div id="customer-pill" class="customer-pill-slot" hidden></div>
      <section id="workload" class="workload" aria-label="Technicians' workload" data-i18n-aria-label="index.team_title" hidden></section>
      <div id="months" class="months"></div>
      <div class="cal-tools">
        <div class="days-ctl" role="group" aria-label="Days shown" data-i18n-aria-label="index.days_label">
          <button type="button" class="days-btn" data-days="all" aria-pressed="true" title="Show the whole week" data-i18n-title="index.days_all_title" data-i18n="index.days_all">7 days</button>
          <button type="button" class="days-btn" data-days="workweek" aria-pressed="false" title="Monday to Friday: Saturday and Sunday appear only where there are interventions" data-i18n-title="index.days_workweek_title" data-i18n="index.days_workweek">Mon–Fri</button>
        </div>
        <div class="zoom-ctl" role="group" aria-label="Calendar zoom" data-i18n-aria-label="index.zoom"
             title="Calendar zoom: hold the middle mouse button and move the mouse forward/back, or pinch on the touchpad"
             data-i18n-title="index.zoom_title">
          <button type="button" id="zoom-out" class="zoom-btn" aria-label="Zoom out the calendar" data-i18n-aria-label="index.zoom_out">−</button>
          <button type="button" id="zoom-reset" class="zoom-value" title="Back to 100%" data-i18n-title="index.zoom_reset">100%</button>
          <button type="button" id="zoom-in" class="zoom-btn" aria-label="Zoom in the calendar" data-i18n-aria-label="index.zoom_in">+</button>
        </div>
      </div>
    </main>

    <aside id="detail" class="detail" aria-labelledby="detail-title" hidden>
      <div class="detail-resizer" role="separator" aria-orientation="horizontal" tabindex="0"
           aria-label="Height of the preview (up/down arrows)" data-i18n-aria-label="index.detail_resizer_aria"
           title="Drag to adjust the height" data-i18n-title="index.detail_resizer_title"></div>
      <header class="detail-header">
        <div>
          <h2 id="detail-title" class="detail-title"></h2>
          <p class="detail-sub muted"></p>
        </div>
        <div class="detail-actions">
          <button type="button" class="btn btn-small" id="btn-detail-new-event" title="New intervention on this date (in an existing project)" data-i18n-title="index.new_event_title" data-i18n="index.new_event">+ Intervention</button>
          <button type="button" class="icon-btn" id="btn-detail-position" aria-label="Move the preview" title="Move the preview" data-i18n-aria-label="index.move_preview" data-i18n-title="index.move_preview">
            <!-- icona "pannello in basso" (mostrata quando l'anteprima è a destra) -->
            <svg class="ico-to-bottom" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.5" y="2" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2.2" y="9" width="11.6" height="4.3" fill="currentColor" opacity=".55"/></svg>
            <!-- icona "pannello a destra" (mostrata quando l'anteprima è in basso) -->
            <svg class="ico-to-right" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><rect x="1.5" y="2" width="13" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9" y="2.7" width="4.8" height="10.6" fill="currentColor" opacity=".55"/></svg>
          </button>
          <button type="button" class="icon-btn" data-close aria-label="Close details" title="Close (Esc)" data-i18n-aria-label="index.close_detail" data-i18n-title="index.close_detail_title"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        </div>
      </header>
      <div class="detail-body"></div>
    </aside>
  </div>

  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></section>

  <section id="gantt" class="sheet gantt" role="dialog" aria-modal="true" aria-labelledby="gantt-title" hidden></section>

  <section id="inventory" class="sheet inventory" role="dialog" aria-modal="true" aria-labelledby="inventory-title" hidden></section>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
